root = "."
tmp_dir = ".air"

[build]
  cmd = "go build -o ./.air/fastiot-dev.exe ./cmd/fastiot"
  bin = ".air/fastiot-dev.exe"
  full_bin = ".air/fastiot-dev.exe -port 62943 -nats-port 9820 -data ./data/dev"
  include_ext = ["go", "html", "css", "ts", "tsx"]
  exclude_dir = ["third_party", "frontend", "internal/web/dist", "data", ".air", ".git"]
  delay = 500
  stop_on_error = true
  send_interrupt = true

[log]
  time = true
